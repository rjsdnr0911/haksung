<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Defense Game</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
            font-size: 16px;
        }
        #ui > * {
            pointer-events: all;
        }

        /* Start Screen */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #startScreen h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            color: #ff4444;
            text-shadow: 0 0 20px #ff4444;
        }
        #startScreen button {
            background: #ff4444;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }
        #startScreen button:hover {
            background: #ff6666;
            transform: scale(1.1);
        }
        .controls {
            margin-top: 3rem;
            text-align: center;
        }
        .controls p {
            margin: 0.5rem 0;
            font-size: 1.1rem;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
        }
        #health {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .health-bar {
            width: 300px;
            height: 30px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            border-radius: 5px;
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff4444, #ff8888);
            transition: width 0.3s;
        }
        #waveInfo {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            font-size: 1.5rem;
            text-shadow: 2px 2px 4px black;
        }
        #ammo {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #ffaa00;
            text-shadow: 2px 2px 4px black;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: white;
            text-shadow: 0 0 5px black;
            pointer-events: none;
        }

        /* Perk Selection */
        #perkScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #perkScreen h2 {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #44ff44;
        }
        .perk-container {
            display: flex;
            gap: 30px;
        }
        .perk-card {
            background: rgba(50, 50, 50, 0.9);
            border: 3px solid #888;
            border-radius: 10px;
            padding: 30px;
            width: 280px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .perk-card:hover {
            border-color: #44ff44;
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(68, 255, 68, 0.5);
        }
        .perk-card h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #44ff44;
        }
        .perk-card p {
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .perk-type {
            display: inline-block;
            padding: 5px 10px;
            background: #ff4444;
            border-radius: 3px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        /* Game Over */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #gameOverScreen h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            color: #888;
        }
        #gameOverScreen button {
            background: #888;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }
        #gameOverScreen button:hover {
            background: #aaa;
        }

        .hidden {
            display: none !important;
        }

        /* Mode Selection */
        .mode-card {
            background: rgba(50, 50, 50, 0.9);
            border: 3px solid #888;
            border-radius: 10px;
            padding: 30px;
            width: 300px;
            text-align: center;
            transition: all 0.3s;
        }
        .mode-card:hover {
            border-color: #ff4444;
            transform: translateY(-5px);
        }
        .mode-card h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #ff4444;
        }
        .mode-card p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #ccc;
        }
        .mode-button {
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .mode-button:hover {
            background: #ff6666;
            transform: scale(1.05);
        }

        /* Mobile Controls */
        #mobileControls {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #mobileControls.active {
            display: block;
        }
        #mobileControls > * {
            pointer-events: all;
        }

        /* Virtual Joystick */
        #joystickArea {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
        }
        #joystickBase {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
        }
        #joystickStick {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        /* Mobile Buttons */
        .mobile-button {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px black;
            user-select: none;
            -webkit-user-select: none;
        }
        .mobile-button:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        #shootButton {
            bottom: 30px;
            right: 30px;
            width: 100px;
            height: 100px;
            background: rgba(255, 68, 68, 0.4);
            border-color: rgba(255, 68, 68, 0.8);
        }
        #shootButton:active {
            background: rgba(255, 68, 68, 0.6);
        }
        #reloadButton {
            bottom: 140px;
            right: 30px;
            width: 70px;
            height: 70px;
            font-size: 1.2rem;
            background: rgba(255, 170, 0, 0.4);
            border-color: rgba(255, 170, 0, 0.8);
        }
        #reloadButton:active {
            background: rgba(255, 170, 0, 0.6);
        }
        #shootRightButton {
            bottom: 30px;
            right: 150px;
            width: 90px;
            height: 90px;
            background: rgba(68, 136, 255, 0.4);
            border-color: rgba(68, 136, 255, 0.8);
        }
        #shootRightButton:active {
            background: rgba(68, 136, 255, 0.6);
        }

        /* Fullscreen button */
        #fullscreenBtn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        #fullscreenBtn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        /* Item Inventory HUD */
        #itemInventory {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item-slot {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 12px;
            min-width: 200px;
        }
        .item-icon {
            font-size: 1.8rem;
            margin-right: 10px;
        }
        .item-info {
            flex: 1;
        }
        .item-name {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
        }
        .item-level {
            font-size: 0.85rem;
            color: #ffaa00;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            #startScreen h1 {
                font-size: 3rem;
            }
            #startScreen p {
                font-size: 1.2rem !important;
            }
            .perk-container {
                flex-direction: column;
                gap: 15px;
            }
            .perk-card {
                width: 250px;
                padding: 20px;
            }
            #hud {
                top: 10px;
                left: 10px;
                right: 10px;
            }
            .health-bar {
                width: 150px;
            }
            #health {
                font-size: 1rem;
            }
            #waveInfo {
                font-size: 1rem;
                top: 10px;
                right: 10px;
            }
            #ammo {
                bottom: 140px;
                right: 140px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="ui">
        <!-- Start Screen -->
        <div id="startScreen">
            <h1>FPS SURVIVAL</h1>
            <p style="font-size: 1.5rem; margin-bottom: 1rem;">20분간 생존하며 레벨업하세요</p>

            <!-- Settings Panel -->
            <div style="background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; margin-bottom: 2rem; min-width: 300px;">
                <h3 style="margin-top: 0;">설정</h3>
                <div style="margin: 15px 0;">
                    <label for="sensitivitySlider">마우스 민감도: <span id="sensitivityValue">1.0</span></label>
                    <input type="range" id="sensitivitySlider" min="0.1" max="3.0" step="0.1" value="1.0"
                           style="width: 100%; margin-top: 5px;">
                </div>
            </div>

            <button id="startGameBtn" class="mode-button" style="font-size: 1.8rem; padding: 20px 60px;">게임 시작</button>

            <div class="controls">
                <h3>조작법</h3>
                <p>WASD: 이동</p>
                <p>마우스: 시점 이동</p>
                <p>좌/우클릭: 양손 무기 사격</p>
                <p>R: 재장전</p>
                <p>F: 전체화면</p>
            </div>
            <button id="fullscreenBtn">⛶ 전체화면</button>
        </div>

        <!-- Survival Mode HUD -->
        <div id="survivalHud" class="hidden">
            <!-- Top Bar -->
            <div style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center;">
                <div id="timer" style="font-size: 2.5rem; font-weight: bold; color: #ffaa00; text-shadow: 2px 2px 4px black;">
                    00:00 / 20:00
                </div>
                <div id="levelBar" style="margin-top: 10px;">
                    <div style="font-size: 1.3rem; margin-bottom: 5px;">Lv <span id="playerLevel">1</span></div>
                    <div style="width: 400px; height: 20px; background: rgba(0,0,0,0.7); border: 2px solid white; border-radius: 10px; overflow: hidden;">
                        <div id="xpFill" style="height: 100%; background: linear-gradient(to right, #44ff44, #88ff88); width: 0%; transition: width 0.3s;"></div>
                    </div>
                </div>
            </div>

            <!-- Health -->
            <div style="position: absolute; top: 20px; left: 20px;">
                <div style="font-size: 1.3rem; margin-bottom: 5px;">HP: <span id="survivalHealthText">100/100</span></div>
                <div class="health-bar">
                    <div class="health-fill" id="survivalHealthFill" style="width: 100%;"></div>
                </div>
            </div>

            <!-- Kill Counter -->
            <div id="killCounter" style="position: absolute; top: 20px; right: 20px; font-size: 1.5rem; text-shadow: 2px 2px 4px black;">
                Kills: <span id="killCount">0</span>
            </div>

            <!-- Weapon Display -->
            <div style="position: absolute; bottom: 30px; left: 30px; right: 30px; display: flex; justify-content: space-between;">
                <div id="leftWeapon" style="font-size: 1.3rem; text-shadow: 2px 2px 4px black;">
                    <div style="color: #ffaa00;">좌클릭</div>
                    <div id="leftWeaponName">권총</div>
                    <div id="leftWeaponAmmo">15/15</div>
                </div>
                <div id="rightWeapon" style="font-size: 1.3rem; text-align: right; text-shadow: 2px 2px 4px black;">
                    <div style="color: #ffaa00;">우클릭</div>
                    <div id="rightWeaponName">라이플</div>
                    <div id="rightWeaponAmmo">30/30</div>
                </div>
            </div>

            <div id="crosshair" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; color: white; text-shadow: 0 0 5px black;">+</div>

            <!-- Item Inventory -->
            <div id="itemInventory"></div>
        </div>

        <!-- Level Up Screen -->
        <div id="levelUpScreen" class="screen hidden">
            <h2 style="font-size: 3rem; margin-bottom: 1rem; color: #44ff44;">레벨 업!</h2>
            <p style="font-size: 1.3rem; margin-bottom: 2rem;">업그레이드를 선택하세요</p>
            <div class="perk-container" id="levelUpContainer">
                <!-- Upgrade cards will be dynamically added here -->
            </div>
        </div>

        <!-- Mobile Controls -->
        <div id="mobileControls">
            <div id="joystickArea">
                <div id="joystickBase"></div>
                <div id="joystickStick"></div>
            </div>
            <div id="shootButton" class="mobile-button">L</div>
            <div id="shootRightButton" class="mobile-button">R</div>
            <div id="reloadButton" class="mobile-button">⟳</div>
        </div>

        <!-- Perk Selection Screen -->
        <div id="perkScreen">
            <h2>웨이브 클리어!</h2>
            <p style="font-size: 1.3rem; margin-bottom: 2rem;">특전을 선택하세요</p>
            <div class="perk-container" id="perkContainer">
                <!-- Perk cards will be dynamically added here -->
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen">
            <h1>게임 오버</h1>
            <p style="font-size: 1.5rem; margin-bottom: 2rem;">도달한 웨이브: <span id="finalWave">0</span></p>
            <button id="restartBtn">다시 시작</button>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
